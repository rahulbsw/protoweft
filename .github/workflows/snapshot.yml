name: Snapshot

# Publishes main's -SNAPSHOT (the version in gradle.properties) of every protoweft-* library and the
# BOM to the Central Portal snapshot repository, https://central.sonatype.com/repository/maven-snapshots/,
# on every push to main (a burst of merges collapses into one run). Snapshots are unsigned and
# unvalidated, and Central deletes them after 90 days. The namespace must have SNAPSHOTs enabled
# on the Central Portal (see RELEASING.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  publish:
    name: Publish the snapshot
    if: github.repository == 'rahulbsw/protoweft'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that main carries a snapshot version
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [[ "$version" != *-SNAPSHOT ]]; then
            echo "::error::gradle.properties has version=$version; main must carry a -SNAPSHOT version."; exit 1
          fi
          echo "Publishing $version"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Publish to the Central Portal snapshot repository
        # Merges to main have already passed the required checks, so the tests are not rerun here.
        # Kept light, because Central rate-limits by egress IP and GitHub's runners share theirs
        # (429 Too Many Requests; repeated bursts escalate to longer blocks, see
        # https://central.sonatype.org/faq/429-error/): one module at a time (--no-parallel), and
        # md5 and sha1 checksums only (Gradle's sha256/sha512 add 14 of 35 uploads per module and
        # Central does not need them). No automatic retry: Sonatype advises against retrying
        # harder. A throttled run is re-run by hand later; the next push publishes anyway.
        run: >-
          ./gradlew publishToMavenCentral --no-parallel --no-configuration-cache --console=plain
          -Dorg.gradle.internal.publish.checksums.insecure=true
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_ARTIFACTORY_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_ARTIFACTORY_TOKEN }}
