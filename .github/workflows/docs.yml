name: Documentation

# Builds the Zensical site plus the aggregated Javadoc (served under /api/) and deploys both to
# GitHub Pages. Enable Pages with "Source: GitHub Actions" in the repository settings.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '**/src/main/java/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one, but never cancels a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Caching is disabled: this job runs rarely, and Zensical advises against CI caches for now.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Build the aggregated Javadoc
        run: ./gradlew aggregateJavadoc --console=plain

      - uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install Zensical
        run: pip install zensical

      - name: Build the site
        run: zensical build --clean

      - name: Add the Javadoc under /api/
        run: cp -R build/docs/javadoc site/api

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - uses: actions/deploy-pages@v5
        id: deployment
