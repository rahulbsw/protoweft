name: Release

# Releases every protoweft-* library and the BOM to Maven Central. Start it from the Actions tab
# ("Run workflow" on main) with the version to release, for example 0.1.0 or 0.1.0-rc.1. See
# RELEASING.md.
#
#   verify     checks the version, builds and tests main's head, and takes the release notes from
#              the CHANGELOG's [Unreleased] section;
#   publish    waits for approval on the maven-central environment, then signs and publishes,
#              attests the jars and the SBOM, and creates the tag v<version> and the GitHub release;
#   follow-up  (final releases only) opens a PR that moves the notes under the version and bumps
#              main to the next -SNAPSHOT. main only accepts pull requests, so the bookkeeping
#              cannot be committed directly.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (for example 0.1.0 or 0.1.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      next: ${{ steps.version.outputs.next }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the version, the branch and the tag
        id: version
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [[ "$REF" != refs/heads/main ]]; then
            echo "::error::Releases are made from main (this run is on $REF)."; exit 1
          fi
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-(alpha|beta|rc)\.?[0-9]+)?$ ]]; then
            echo "::error::'$VERSION' is not a release version: use MAJOR.MINOR.PATCH, optionally -alpha.N, -beta.N or -rc.N."
            exit 1
          fi
          if git ls-remote --exit-code --tags "$REPO_URL" "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists: a version is released only once."; exit 1
          fi
          prerelease=false
          [[ -n "${BASH_REMATCH[4]}" ]] && prerelease=true
          next="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-SNAPSHOT"
          {
            echo "version=$VERSION"
            echo "prerelease=$prerelease"
            echo "next=$next"
          } >> "$GITHUB_OUTPUT"
      - name: Take the release notes from the CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          mkdir -p build/release
          awk '/^## \[Unreleased\]/ { found = 1; next } /^## \[/ { if (found) exit } found' CHANGELOG.md \
            | sed -e '/./,$!d' > build/release/notes.md
          if [[ ! -s build/release/notes.md ]]; then
            if [[ "$PRERELEASE" == true ]]; then
              echo "No unreleased changes recorded." > build/release/notes.md
            else
              echo "::error::The CHANGELOG's [Unreleased] section is empty: record the changes before releasing."
              exit 1
            fi
          fi
          printf '\n## Using it\n\n```kotlin\nimplementation(platform("io.github.rahulbsw:protoweft-bom:%s"))\n```\n' \
            "$VERSION" >> build/release/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: build/release/notes.md
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build and test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew build -Pversion="$VERSION" --console=plain

  publish:
    name: Publish to Maven Central
    needs: verify
    runs-on: ubuntu-latest
    # Requires the owner's approval; holds the signing key. Maven Central releases are permanent.
    environment: maven-central
    permissions:
      contents: write           # create the tag and the GitHub release
      id-token: write           # sign the provenance and SBOM attestations
      attestations: write       # store the attestations
      artifact-metadata: write  # record the attested artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check the publishing secrets
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_ARTIFACTORY_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.MAVEN_ARTIFACTORY_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "$CENTRAL_USERNAME" ]] || missing+=(MAVEN_ARTIFACTORY_USERNAME)
          [[ -n "$CENTRAL_TOKEN" ]] || missing+=(MAVEN_ARTIFACTORY_TOKEN)
          [[ -n "$SIGNING_KEY" ]] || missing+=(SIGNING_KEY)
          [[ -n "$SIGNING_KEY_PASSWORD" ]] || missing+=(SIGNING_KEY_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "::error::Missing secrets: ${missing[*]} (see RELEASING.md)."; exit 1
          fi
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Sign and publish to Maven Central
        # The tests ran in verify on the same commit; publishing rebuilds the jars without them.
        run: ./gradlew assemble cyclonedxBom publishAndReleaseToMavenCentral -Pversion="$VERSION" --no-configuration-cache --console=plain
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_ARTIFACTORY_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_ARTIFACTORY_TOKEN }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'protoweft-*/build/libs/*.jar'
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'protoweft-*/build/libs/*.jar'
          sbom-path: build/reports/cyclonedx/bom.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: build/release
      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          SHA: ${{ github.sha }}
        run: |
          flags=()
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "v$VERSION" --target "$SHA" --title "Protoweft $VERSION" \
            --notes-file build/release/notes.md "${flags[@]}" \
            protoweft-*/build/libs/*.jar build/reports/cyclonedx/bom.json

  follow-up:
    name: Open the follow-up PR
    needs: [verify, publish]
    if: needs.verify.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the follow-up branch
      pull-requests: write  # open the follow-up PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Move the notes under the version and bump main to the next snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          NEXT: ${{ needs.verify.outputs.next }}
        run: |
          branch="release/v$VERSION"
          git switch -c "$branch"
          # Branched from the released commit, so exactly the released notes move; the PR merges
          # any changelog entries added to main since.
          today="$(date -u +%Y-%m-%d)"
          awk -v heading="## [$VERSION] - $today" \
            '!done && /^## \[Unreleased\]/ { print; print ""; print heading; done = 1; next } { print }' \
            CHANGELOG.md > CHANGELOG.md.new && mv CHANGELOG.md.new CHANGELOG.md
          sed -i -E "s/^version=.*/version=$NEXT/" gradle.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Record release $VERSION and start $NEXT"
          gh auth setup-git   # the token reaches git through gh's credential helper, not .git/config
          git push origin "$branch"
          cat > build-pr-body.md <<EOF
          Protoweft $VERSION is on Maven Central and tagged \`v$VERSION\`. This moves the released notes under
          \`## [$VERSION] - $today\` in the CHANGELOG and sets \`version=$NEXT\` for the snapshots main publishes.

          Opened by the Release workflow. Its token cannot start other workflows, so the required checks have not
          run: close and reopen this PR to run them, or merge with admin bypass (the change is CHANGELOG.md and
          gradle.properties only).
          EOF
          gh pr create --base main --head "$branch" --title "Record release $VERSION and start $NEXT" \
            --body-file build-pr-body.md
