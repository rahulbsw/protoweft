name: Conformance

# The official MCP conformance suite (server and client scenarios) and the A2A TCK, run against
# the apps in conformance/. Each job exits 0 only when every failure is listed in its baseline
# (conformance/*-baseline.yml) and no baseline entry is stale. See docs/operations/conformance.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  MCP_CONFORMANCE_VERSION: 0.2.0-alpha.12
  MCP_SPEC_VERSION: 2025-11-25
  A2A_TCK_VERSION: 1.0.0.alpha3

jobs:
  mcp-server:
    name: MCP server conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Run the MCP conformance suite (server, --suite active)
        run: scripts/conformance/mcp-server.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-mcp-server
          path: build/conformance/mcp-server/
          if-no-files-found: warn

  mcp-client:
    name: MCP client conformance (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every client scenario required for 2025-11-25: the 4 non-auth ones and the 14 auth/*
        # ones (the suite's `auth` suite; McpClientConnector with agentweave-oauth's OAuthClient).
        scenario:
          - initialize
          - tools_call
          - elicitation-sep1034-client-defaults
          - sse-retry
          - auth/metadata-default
          - auth/metadata-var1
          - auth/metadata-var2
          - auth/metadata-var3
          - auth/basic-cimd
          - auth/scope-from-www-authenticate
          - auth/scope-from-scopes-supported
          - auth/scope-omitted-when-undefined
          - auth/scope-step-up
          - auth/scope-retry-limit
          - auth/token-endpoint-auth-basic
          - auth/token-endpoint-auth-post
          - auth/token-endpoint-auth-none
          - auth/pre-registration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Run the MCP conformance suite (client, ${{ matrix.scenario }})
        run: scripts/conformance/mcp-client.sh '${{ matrix.scenario }}'
      # Artifact names cannot contain '/', which auth/* scenario names do.
      - name: Artifact name
        id: artifact
        if: always()
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: echo "name=conformance-mcp-client-${SCENARIO//\//-}" >> "$GITHUB_OUTPUT"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/conformance/mcp-client/
          if-no-files-found: warn

  a2a-tck:
    name: A2A TCK (MUST)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install 'uv==0.5.1'
      - name: Run the A2A TCK (--level must)
        env:
          A2A_TCK_PYTHON: python3.12
        run: scripts/conformance/a2a-tck.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-a2a-tck
          path: build/conformance/a2a-tck/
          if-no-files-found: warn
