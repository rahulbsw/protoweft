name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build
        run: ./gradlew build --console=plain
      - name: Check that publishing works (unsigned, local)
        if: matrix.java == '17'
        run: ./gradlew publishToMavenLocal -Pversion=0.0.0-ci --console=plain
      - name: Build the starter templates against the local publication
        if: matrix.java == '17'
        run: |
          for t in templates/*/; do
            ./gradlew -p "$t" build --init-script "$PWD/templates/verify-with-maven-local.init.gradle.kts" \
              -PprotoweftVersion=0.0.0-ci --console=plain
          done
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: '**/build/reports/tests/'

  argi-neutral:
    name: ARGI neutral adapter (pinned ARGI snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Cache pinned ARGI snapshot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository/io/github/agentic-ai-java
            ~/.cache/protoweft/argi-src
          key: argi-${{ hashFiles('scripts/install-argi-snapshot.sh') }}
      - name: Install pinned ARGI (Spring-free modules) to mavenLocal
        run: scripts/install-argi-snapshot.sh
      - name: Build protoweft-argi-neutral
        run: ./gradlew -PargiSnapshot :protoweft-argi-neutral:build --console=plain

  fuzz:
    name: Fuzz untrusted-input parsers (Jazzer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Compile the fuzz tests
        run: >-
          ./gradlew --console=plain :protoweft-rap:fuzzClasses :protoweft-utcp:fuzzClasses
          :protoweft-oauth:fuzzClasses :protoweft-discovery-embeddings:fuzzClasses :protoweft-agui:fuzzClasses
      # One fuzz test per Gradle run (Jazzer fuzzes a single test per JVM), each for
      # JAZZER_MAX_DURATION. --rerun keeps the build cache from replaying an earlier result.
      - name: Fuzz each target
        env:
          JAZZER_FUZZ: '1'
          JAZZER_MAX_DURATION: 40s
        run: |
          status=0
          for target in \
            protoweft-rap:io.github.rahulbsw.protoweft.rap.ClientCallbacksFuzzTest.callbackBodies \
            protoweft-rap:io.github.rahulbsw.protoweft.rap.ToolsetFuzzTest.manifest \
            protoweft-agui:io.github.rahulbsw.protoweft.agui.WireFuzzTest.runInput \
            protoweft-agui:io.github.rahulbsw.protoweft.agui.WireFuzzTest.event \
            protoweft-agui:io.github.rahulbsw.protoweft.agui.JsonPatchFuzzTest.patch \
            protoweft-utcp:io.github.rahulbsw.protoweft.utcp.ManualFuzzTest.manual \
            protoweft-utcp:io.github.rahulbsw.protoweft.utcp.UrlSecurityFuzzTest.urls \
            protoweft-oauth:io.github.rahulbsw.protoweft.oauth.ChallengeFuzzTest.wwwAuthenticate \
            protoweft-oauth:io.github.rahulbsw.protoweft.oauth.ProtectedResourceMetadataFuzzTest.document \
            protoweft-discovery-embeddings:io.github.rahulbsw.protoweft.discovery.embeddings.WordPieceTokenizerFuzzTest.encode \
            protoweft-discovery-embeddings:io.github.rahulbsw.protoweft.discovery.embeddings.WordPieceTokenizerFuzzTest.encodePair \
            protoweft-discovery-embeddings:io.github.rahulbsw.protoweft.discovery.embeddings.WordPieceTokenizerFuzzTest.encodePairStructured
          do
            echo "::group::${target#*:}"
            ./gradlew --console=plain ":${target%%:*}:fuzzTest" --tests "${target#*:}" --rerun || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Upload crashing inputs and reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: |
            # Jazzer 0.30.0 writes findings to src/test/resources/<package>/<Class>Inputs/<method>/
            # when the module has src/test/resources, else to the module root (FuzzTestExecutor).
            protoweft-*/src/test/resources/**/crash-*
            protoweft-*/src/test/resources/**/timeout-*
            protoweft-*/src/test/resources/**/oom-*
            protoweft-*/crash-*
            protoweft-*/timeout-*
            protoweft-*/oom-*
            **/build/test-results/fuzzTest/*FuzzTest.xml
            **/build/reports/tests/
