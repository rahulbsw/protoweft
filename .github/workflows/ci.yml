name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the Gradle wrapper checksum
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build
        run: ./gradlew build --console=plain
      - name: Check that publishing works (unsigned, local)
        if: matrix.java == '17'
        run: ./gradlew publishToMavenLocal -Pversion=0.0.0-ci --console=plain
      - name: Build the starter templates against the local publication
        if: matrix.java == '17'
        run: |
          for t in templates/*/; do
            ./gradlew -p "$t" build --init-script "$PWD/templates/verify-with-maven-local.init.gradle.kts" \
              -PprotoweftVersion=0.0.0-ci --console=plain
          done
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: '**/build/reports/tests/'

  argi-neutral:
    name: ARGI neutral adapter (pinned ARGI snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Cache pinned ARGI snapshot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.m2/repository/io/github/agentic-ai-java
            ~/.cache/protoweft/argi-src
          key: argi-${{ hashFiles('scripts/install-argi-snapshot.sh') }}
      - name: Install pinned ARGI (Spring-free modules) to mavenLocal
        run: scripts/install-argi-snapshot.sh
      - name: Build protoweft-argi-neutral
        run: ./gradlew -PargiSnapshot :protoweft-argi-neutral:build --console=plain
