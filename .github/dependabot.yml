# Weekly dependency updates. Gradle PRs need the dependency verification metadata regenerated
# before CI passes (see CONTRIBUTING.md, "Changing dependencies").
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /interop/rap/rust-client
    schedule:
      interval: weekly
    groups:
      interop-crates:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /interop/agui/ts
    schedule:
      interval: weekly
    groups:
      interop-agui-npm:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /interop/agui/python
    schedule:
      interval: weekly
    groups:
      interop-agui-pip:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /examples/agui-web/frontend
    schedule:
      interval: weekly
    groups:
      example-agui-web-npm:
        patterns: ['*']
