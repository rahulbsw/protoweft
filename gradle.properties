group=io.github.rahulbsw
version=0.1.0-SNAPSHOT

# Java baseline
javaSourceCompatibility=17
javaTargetCompatibility=17

# Dependency versions (centralized)
mcpSdkVersion=2.1.0
a2aSdkVersion=1.5.0.Final
langchain4jVersion=1.23.0
springBootVersion=4.1.2
springAiVersion=2.0.2
argiVersion=2.1.0-RC1
nimbusOauthVersion=11.39
nimbusJoseVersion=10.10
# Jackson 3 (tools.jackson), aligned with MCP SDK 2.1.0 and Spring Boot 4
jackson3Version=3.1.4
servletApiVersion=6.1.0
# Optional for protoweft-agui's HTTP + Protobuf binding (compileOnly); the same line protoweft-a2a
# ships through a2a-java. protoc generates with the same version, so apps need protobuf-java >= it.
protobufVersion=4.36.2
jettyVersion=12.1.14
slf4jVersion=2.0.17

# Test
junitVersion=5.11.4
assertjVersion=3.27.3
# Fuzz tests (@FuzzTest), see CONTRIBUTING.md "Fuzzing"
jazzerVersion=0.30.0
# AG-UI tests validate every event against the official JSON Schema (test classpath only)
jsonSchemaValidatorVersion=3.0.9

# Gradle build
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
jsoupVersion=1.24.1
