spring:
  application:
    name: my-mcp-server

protoweft:
  server:
    mcp:
      enabled: true     # MCP over Streamable HTTP at http://localhost:8080/mcp
    # utcp:
    #   enabled: true   # UTCP manual at /utcp
    # a2a:
    #   enabled: true   # needs an AgentHandler bean; card at /.well-known/agent-card.json

# Before exposing this beyond localhost, protect /mcp: define an InboundAuthenticator bean, or
