site_name: AgentWeave
site_description: The protocol backbone for Java agents. MCP, A2A and UTCP behind one protocol-neutral API.
copyright: Copyright &copy; 2026 The AgentWeave Authors. MIT License.

# Set these once the repository's public location is known, for example:
# site_url: https://<owner>.github.io/<repository>/
# repo_url: https://github.com/<owner>/<repository>
# repo_name: <owner>/<repository>
# edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Lets reference pages include repository files (CHANGELOG.md, LICENSE) so they never drift.
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Tools and the registry: concepts/tools.md
      - Agents: concepts/agents.md
      - Security and credentials: concepts/security.md
      - Errors and observability: concepts/errors-and-observability.md
      - Versions and compliance: concepts/compliance.md
  - Protocols:
      - MCP: protocols/mcp.md
      - A2A: protocols/a2a.md
      - UTCP: protocols/utcp.md
  - Integrations:
      - Spring Boot: integrations/spring-boot.md
      - LangChain4j: integrations/langchain4j.md
      - Embedded Jetty: integrations/jetty.md
  - Examples: examples.md
  - Operations:
      - Troubleshooting: operations/troubleshooting.md
      - Security model: operations/security-model.md
  - Reference:
      - reference/index.md
      - Changelog: reference/changelog.md
      - License: reference/license.md
  - Contributing: contributing.md
